<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>An ka Doni Mara So</title>

  <style>
    body { font-family: Arial; padding: 10px; background:#f5f5f5; }
    input, textarea, button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      font-size: 16px;
    }
    button { background: #2196f3; color: white; border: none; }
    .note {
      background: white;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>

  <!-- Firebase (compat version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>

<h2>📒 An ka Doni Mara So</h2>

<input id="title" placeholder="Titre">
<textarea id="content" placeholder="Écris ta note"></textarea>

<button onclick="saveNote()">💾 Enregistrer</button>

<h3>📚 Notes</h3>
<div id="notes"></div>

<script>
// 🔐 CONFIG FIREBASE (ton config)
const firebaseConfig = {
  apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
  authDomain: "iron-be1a0.firebaseapp.com",
  projectId: "iron-be1a0"
};

// 🚀 INIT
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 💾 SAUVEGARDE
function saveNote() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  if (!title || !content) {
    alert("Remplis les champs !");
    return;
  }

  console.log("Envoi note...");

  db.collection("notes").add({
    title: title,
    content: content,
    createdAt: new Date()
  })
  .then(() => {
    alert("✅ Note enregistrée !");
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
  })
  .catch((error) => {
    console.error(error);
    alert("❌ Erreur Firebase !");
  });
}

// 📥 CHARGEMENT
function loadNotes() {
  db.collection("notes")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {

      const notesDiv = document.getElementById("notes");
      notesDiv.innerHTML = "";

      snapshot.forEach(doc => {
        const note = doc.data();

        const el = document.createElement("div");
        el.className = "note";

        el.innerHTML = `
          <h4>${note.title}</h4>
          <p>${note.content}</p>
        `;

        notesDiv.appendChild(el);
      });
    });
}

// 🔄 LANCEMENT
loadNotes();

</script>

</body>
</html>
