
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>An ka Doni Mara So</title>
  <style>
    body { font-family: Arial; padding: 10px; }
    input, textarea, button { width: 100%; margin: 5px 0; padding: 10px; }
    .note { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<h2>📒 An ka Doni Mara So</h2>

<input id="title" placeholder="Titre">
<textarea id="content" placeholder="Écris ta note"></textarea>

<input type="file" id="file">

<button onclick="saveNote()">💾 Enregistrer</button>

<h3>📚 Notes</h3>
<div id="notes"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
  authDomain: "iron-be1a0.firebaseapp.com",
  projectId: "iron-be1a0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function saveNote() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  db.collection("notes").add({
    title: title,
    content: content,
    date: new Date()
  });
}

function loadNotes() {
  db.collection("notes").onSnapshot(snapshot => {
    const notesDiv = document.getElementById("notes");
    notesDiv.innerHTML = "";

    snapshot.forEach(doc => {
      const note = doc.data();
      notesDiv.innerHTML += `
        <div class="note">
          <h4>${note.title}</h4>
          <p>${note.content}</p>
        </div>
      `;
    });
  });
}

loadNotes();
</script>

</body>
</html>
