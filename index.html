<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doni mara so - Bloc-notes</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #ffffff;
            --surface: #f2f2f7;
            --text: #1c1c1e;
            --primary: #007aff;
            --border: #d1d1d6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --surface: #2c2c2e;
                --text: #f2f2f7;
                --primary: #0a84ff;
                --border: #38383a;
            }
        }

        * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Auth Screen */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .auth-card { background: var(--surface); padding: 25px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        button.secondary { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        /* Main App Interface */
        #app-screen { display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border); background: var(--surface); }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* List Sidebar */
        #notes-list { width: 35%; border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
        .note-item { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .note-item:active { background: var(--bg); }
        .note-item h4 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Editor Area */
        #editor { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        #note-title { font-size: 1.2rem; font-weight: bold; border: none; outline: none; background: transparent; color: var(--text); }
        #note-content { flex: 1; border: none; outline: none; background: transparent; color: var(--text); resize: none; font-size: 1rem; margin-top: 10px; }
        
        .status { font-size: 11px; opacity: 0.6; margin-bottom: 5px; }
        .fab { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 25px; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Mobile specific */
        @media (max-width: 600px) {
            #notes-list { width: 100%; }
            #editor.active { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="color: var(--primary)">Doni mara so</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button onclick="handleSignIn()">Se connecter</button>
            <button onclick="handleSignUp()" class="secondary">Créer un compte</button>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <span style="font-weight: bold;">Mara</span>
            <button onclick="handleSignOut()" style="width: auto; padding: 5px 10px; font-size: 12px; background: #ff3b30;">Quitter</button>
        </header>

        <div class="main-content">
            <div id="notes-list"></div>
            
            <div id="editor" class="hidden">
                <div class="status" id="sync-status">Enregistré</div>
                <input type="text" id="note-title" placeholder="Titre..." oninput="autoSave()">
                <textarea id="note-content" placeholder="Note..." oninput="autoSave()"></textarea>
                <button onclick="closeEditor()" class="secondary" style="margin-top: 10px;">Retour</button>
            </div>
        </div>
        
        <button class="fab" id="add-btn" onclick="createNewNote()">+</button>
    </div>

    <script>
        // CONFIGURATION SUPABASE (tes informations de Ségou-Bagadadji)
        const SB_URL = 'https://xiwdnqypjqmtruviolu.supabase.co';
        const SB_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpd2RucXlwanFtdHJ1dmZpb2x1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NzI5OTksImV4cCI6MjA5NDM0ODk5OX0.ioKD_XvXmZU4V-etRW5pWskEOh1WZy9A_NFY1QOTA8Y';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let currentNoteId = null;
        let saveTimeout = null;

        // AUTHENTIFICATION
        async function handleSignIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
        }

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await sb.auth.signUp({ email, password });
            alert(error ? error.message : "Vérifiez vos emails pour confirmer !");
        }

        async function handleSignOut() { await sb.auth.signOut(); }

        sb.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                fetchNotes();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // GESTION DES NOTES
        async function fetchNotes() {
            const { data, error } = await sb.from('notes').select('*').order('created_at', { ascending: false });
            if (error) return;
            
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            data.forEach(note => {
                const item = document.createElement('div');
                item.className = 'note-item';
                item.innerHTML = `<h4>${note.title || 'Sans titre'}</h4><small>${note.content?.substring(0,25) || ''}...</small>`;
                item.onclick = () => openNote(note);
                list.appendChild(item);
            });
        }

        async function createNewNote() {
            const user = (await sb.auth.getUser()).data.user;
            const { data, error } = await sb.from('notes').insert([{ user_id: user.id, title: '', content: '' }]).select();
            if (data) openNote(data[0]);
        }

        function openNote(note) {
            currentNoteId = note.id;
            document.getElementById('note-title').value = note.title || '';
            document.getElementById('note-content').value = note.content || '';
            document.getElementById('editor').classList.remove('hidden');
            document.getElementById('editor').classList.add('active');
            document.getElementById('add-btn').classList.add('hidden');
        }

        function closeEditor() {
            document.getElementById('editor').classList.add('hidden');
            document.getElementById('editor').classList.remove('active');
            document.getElementById('add-btn').classList.remove('hidden');
            fetchNotes();
        }

        function autoSave() {
            document.getElementById('sync-status').innerText = "Enregistrement...";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const title = document.getElementById('note-title').value;
                const content = document.getElementById('note-content').value;
                await sb.from('notes').update({ title, content }).eq('id', currentNoteId);
                document.getElementById('sync-status').innerText = "Enregistré au cloud";
            }, 1000);
        }
    </script>
</body>
</html>
