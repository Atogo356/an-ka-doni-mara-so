<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>An ka Doni Mara So - HUB FINAL</title>
    
    <!-- Bibliothèques Cloud -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            background: #020617; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        
        .fab {
            width: 72px; height: 72px; border-radius: 50%;
            background: #2563eb; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 4px solid #020617; color: white; cursor: pointer; z-index: 60;
        }
        .fab:active { transform: scale(0.9); }

        .progress-bar-fill {
            height: 100%; background: #3b82f6; width: 0%;
            transition: width 0.3s ease-in-out;
            box-shadow: 0 0 15px #3b82f6;
        }

        video, img { width: 100%; border-radius: 1.5rem; background: #000; display: block; margin-top: 0.8rem; border: 1px solid rgba(255,255,255,0.1); }
        audio { width: 100%; margin-top: 0.8rem; filter: invert(1); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="min-h-screen no-scrollbar overflow-x-hidden">

    <!-- Header System -->
    <header class="sticky top-0 z-50 glass p-5 pt-8">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="status-dot" class="w-3.5 h-3.5 rounded-full bg-slate-700"></div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter uppercase italic leading-none">AN KA DONI MARA SO</h1>
                    <p id="system-msg" class="text-[8px] font-black uppercase tracking-[0.4em] text-slate-500 mt-1">CONNEXION AU RÉSEAU...</p>
                </div>
            </div>
            <button onclick="toggleConsole()" class="p-2 text-slate-600 hover:text-blue-500 transition-colors">
                <i data-lucide="terminal" size="20"></i>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-5 pb-44 space-y-8">
        
        <!-- Console Diagnostic (Cachée par défaut) -->
        <div id="console-panel" class="hidden glass-card rounded-3xl p-5 border-blue-500/20">
            <h3 class="text-[10px] font-black uppercase text-blue-500 tracking-widest mb-3 flex justify-between">
                DIAGNOSTIC CLOUD <span id="diag-clock">--:--</span>
            </h3>
            <div id="diag-log" class="text-[9px] font-mono text-slate-400 space-y-1.5 max-h-40 overflow-y-auto no-scrollbar"></div>
        </div>

        <!-- Formulaire Note -->
        <section class="glass-card rounded-[2.5rem] p-7 border-white/10 shadow-2xl space-y-4">
            <div class="flex items-center gap-2">
                <i data-lucide="edit-3" class="text-blue-500" size="14"></i>
                <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Nouvelle Archive</h3>
            </div>
            <input type="text" id="note-title" placeholder="Titre de l'archive..." class="w-full bg-slate-950/70 border border-white/5 rounded-2xl p-5 outline-none focus:ring-2 focus:ring-blue-600 transition-all font-bold">
            <textarea id="note-content" placeholder="Détails..." rows="2" class="w-full bg-slate-950/70 border border-white/5 rounded-2xl p-5 outline-none focus:ring-2 focus:ring-blue-600 transition-all text-sm resize-none"></textarea>
            <button onclick="pushNote()" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-[1.5rem] font-black uppercase tracking-[0.2em] transition-all active:scale-95 shadow-xl flex items-center justify-center gap-3">
                <i data-lucide="cloud-upload" size="20"></i> ARCHIVER MAINTENANT
            </button>
        </section>

        <!-- Progress Upload Overlay -->
        <div id="up-progress" class="hidden glass-card p-6 rounded-[2rem] border-blue-400/30 animate-in slide-in-from-top duration-500">
            <div class="flex justify-between items-end mb-3">
                <div>
                    <p class="text-[10px] font-black uppercase text-blue-400 tracking-tighter">TRANSFERT EN COURS...</p>
                    <p id="up-filename" class="text-[11px] text-slate-500 italic mt-1 truncate max-w-[200px]">calcul...</p>
                </div>
                <span id="up-percent" class="text-2xl font-black text-white">0%</span>
            </div>
            <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden p-[2px] border border-white/5">
                <div id="up-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Liste des Archives -->
        <div class="flex items-center justify-between px-2">
            <h2 class="text-xs font-black uppercase tracking-[0.3em] text-slate-500">VOTRE SILO</h2>
            <div id="count-badge" class="bg-blue-500/10 text-blue-500 px-3 py-1 rounded-full text-[10px] font-black border border-blue-500/20">0</div>
        </div>

        <div id="archive-list" class="space-y-6">
            <!-- Loading -->
            <div class="py-20 flex flex-col items-center opacity-10">
                <i data-lucide="database" class="animate-pulse mb-3" size="40"></i>
                <p class="text-[9px] font-black uppercase tracking-widest italic">Synchronisation Firestore...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Nav Android Friendly -->
    <nav class="fixed bottom-0 inset-x-0 p-8 z-40 safe-bottom">
        <div class="max-w-xl mx-auto glass p-3 px-10 rounded-[3.5rem] flex items-center justify-between shadow-2xl border-white/10 ring-1 ring-white/5">
            <button onclick="startMedia('audio')" class="p-3 text-slate-500 hover:text-blue-500 active:scale-75 transition-all">
                <i data-lucide="mic" size="24"></i>
            </button>
            <button onclick="startMedia('video')" class="p-3 text-slate-500 hover:text-purple-500 active:scale-75 transition-all">
                <i data-lucide="video" size="24"></i>
            </button>
            
            <div class="relative -top-12">
                <label for="f-input" class="fab">
                    <i data-lucide="plus" size="36"></i>
                </label>
                <input type="file" id="f-input" class="hidden" onchange="fileRouter(event)" accept="image/*,video/*,audio/*">
            </div>
            
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="p-3 text-slate-500 hover:text-green-500 active:scale-75 transition-all">
                <i data-lucide="arrow-up-circle" size="24"></i>
            </button>
            <button onclick="location.reload()" class="p-3 text-slate-500 hover:text-orange-500 active:scale-75 transition-all">
                <i data-lucide="refresh-cw" size="24"></i>
            </button>
        </div>
    </nav>

    <!-- HUD CAPTURE -->
    <div id="hud" class="hidden fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center p-10 text-white">
        <div class="w-32 h-32 rounded-full bg-red-600 flex items-center justify-center shadow-[0_0_60px_rgba(220,38,38,0.4)] animate-pulse mb-10">
            <i id="hud-icon" data-lucide="mic" size="40"></i>
        </div>
        <h2 id="hud-type" class="text-3xl font-black italic uppercase italic tracking-tighter mb-2">CAPTURING</h2>
        <div id="hud-time" class="text-red-500 font-mono text-6xl font-black mb-14 tracking-tighter">00:00</div>
        
        <div id="vid-preview-box" class="hidden w-full max-w-sm aspect-video rounded-3xl overflow-hidden mb-14 border border-white/10">
            <video id="vid-preview" autoplay muted playsinline class="w-full h-full object-cover"></video>
        </div>
        
        <button onclick="stopMedia()" class="w-full max-w-sm py-8 bg-red-600 rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-all">TERMINER</button>
    </div>

    <script>
        // --- SECURE CONFIG ---
        const FIRE_CFG = {
            apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
            authDomain: "iron-be1a0.firebaseapp.com", // CORRIGÉ .com
            projectId: "iron-be1a0"
        };
        
        const SB_URL = "https://ajobmetgfnjphlginpxc.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqb2JtZXRnZm5qcGhsZ2luc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMTczMzcsImV4cCI6MjA5Mzg5MzMzN30.wtqJsBUCkW8CnZ1eu3vZMweo1v7nxle3fVpkmcDkgcA";
        const BUCKET = "mara"; // CORRIGÉ selon captures

        let db_store, sb_store;

        // --- INIT SYSTÈME ---
        window.onload = async () => {
            console.log("🚀 MARA SO BOOTING...");
            diag("Initialisation Systèmes...", "process");
            try {
                // Icons
                lucide.createIcons();
                
                // Firestore Setup
                if (!firebase.apps.length) firebase.initializeApp(FIRE_CFG);
                db_store = firebase.firestore();
                diag("Firestore : Connecté avec succès", "success");
                
                // Supabase Setup
                if (window.supabase) {
                    sb_store = window.supabase.createClient(SB_URL, SB_KEY);
                    diag("Supabase : Client prêt", "success");
                    await runSystemCheck();
                }

                // Sync UI
                startRealtimeSync();
            } catch (e) {
                diag(`ERREUR INIT: ${e.message}`, "error");
                document.getElementById('console-panel').classList.remove('hidden');
            }
        };

        // TEST AUTOMATIQUE AU DÉMARRAGE
        async function runSystemCheck() {
            diag(`Scan du Bucket [${BUCKET}]...`, "process");
            try {
                // Test listing
                const { error: testErr } = await sb_store.storage.from(BUCKET).list('', { limit: 1 });
                if(testErr) {
                    diag(`Alerte Bucket: ${testErr.message}`, "error");
                    if(testErr.message.includes("not found")) {
                        diag("FATAL: Bucket 'mara' introuvable !", "error");
                        document.getElementById('console-panel').classList.remove('hidden');
                    }
                } else {
                    diag("Bucket validé et accessible.", "success");
                    document.getElementById('system-msg').innerText = "HUB CLOUD SÉCURISÉ PRÊT";
                    document.getElementById('status-dot').className = "w-3.5 h-3.5 rounded-full bg-green-500 shadow-[0_0_15px_#22c55e]";
                    
                    // Test d'écriture invisible pour confirmer RLS
                    const testBlob = new Blob(["OK"], { type: 'text/plain' });
                    const { error: upErr } = await sb_store.storage.from(BUCKET).upload('.sys/test.txt', testBlob, { upsert: true });
                    if(upErr) diag(`RLS Writing: Accès refusé (${upErr.message})`, "error");
                    else diag(`Permissions RLS: OK`, "success");
                }
            } catch (e) { diag(`Diag Exception: ${e.message}`, "error"); }
        }

        // TOOL: DIAGNOSTIC UI
        function diag(msg, type = "info") {
            const el = document.getElementById('diag-log');
            const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('diag-clock').innerText = time;
            
            let color = "text-slate-500";
            if(type === "success") color = "text-green-500 font-bold";
            if(type === "error") color = "text-red-500 font-bold";
            if(type === "process") color = "text-blue-500 italic animate-pulse";

            el.innerHTML += `<div class="${color} border-l-2 border-white/5 pl-2">» ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        function toggleConsole() { document.getElementById('console-panel').classList.toggle('hidden'); }

        // --- ACTION: SAVE TEXT NOTE ---
        async function pushNote() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();
            if(!title) return alert("Archive impossible sans titre.");

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="animate-spin"></i>`;
            lucide.createIcons();

            try {
                await db_store.collection('notes').add({
                    title, content, fileUrl: null, fileType: 'text',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('note-title').value = '';
                document.getElementById('note-content').value = '';
                diag(`Note "${title}" indexée`, "success");
            } catch (e) {
                diag(`Firestore Write Error: ${e.message}`, "error");
                alert(`Erreur Cloud: ${e.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="cloud-upload" size="20"></i> ARCHIVER MAINTENANT`;
                lucide.createIcons();
            }
        }

        // --- ACTION: UPLOAD ROUTER ---
        async function fileRouter(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const raw = file.type.split('/')[0];
            const type = ['image', 'audio', 'video'].includes(raw) ? raw : 'file';
            
            diag(`Préparation flux: ${file.name} (${type})`, "process");
            await cloudTransfer(file, type);
            e.target.value = '';
        }

        async function cloudTransfer(file, type) {
            const panel = document.getElementById('up-progress');
            const bar = document.getElementById('up-bar');
            const perc = document.getElementById('up-percent');
            
            panel.classList.remove('hidden');
            document.getElementById('up-filename').innerText = file.name;
            bar.style.width = '0%';
            perc.innerText = '0%';

            const uid = Date.now();
            const ext = file.name.includes('.') ? file.name.split('.').pop() : 'data';
            const path = `${type}s/arch_${uid}.${ext}`;

            try {
                // Petit hack d'UI pour mobile (progress feedback immediat)
                setTimeout(() => { bar.style.width = '15%'; perc.innerText = '15%'; }, 100);

                const { data, error } = await sb_store.storage.from(BUCKET).upload(path, file, {
                    cacheControl: '3600',
                    upsert: true,
                    contentType: file.type || 'application/octet-stream'
                });

                if (error) throw error;

                bar.style.width = '100%';
                perc.innerText = '100%';
                diag(`Upload réussi: ${path}`, "success");

                const { data: { publicUrl } } = sb_store.storage.from(BUCKET).getPublicUrl(path);

                await db_store.collection('notes').add({
                    title: `Archive ${type.toUpperCase()} - ${new Date().toLocaleTimeString('fr-FR')}`,
                    content: `Document: ${file.name}`,
                    fileUrl: publicUrl,
                    fileType: type,
                    storagePath: path,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                diag(`Indexation Firestore terminée`, "success");
                setTimeout(() => panel.classList.add('hidden'), 2000);

            } catch (err) {
                diag(`CRASH TRANSFERT: ${err.message}`, "error");
                alert(`Supabase Error: ${err.message}`);
                setTimeout(() => panel.classList.add('hidden'), 5000);
            }
        }

        // --- CAPTURE HUB ---
        let rec = null, chunks = [], clock = null;

        async function startMedia(type) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, 
                    video: type === 'video' 
                });
                
                if (type === 'video') {
                    document.getElementById('vid-preview-box').classList.remove('hidden');
                    document.getElementById('vid-preview').srcObject = stream;
                } else {
                    document.getElementById('vid-preview-box').classList.add('hidden');
                }
                
                chunks = [];
                rec = new MediaRecorder(stream);
                rec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                rec.onstop = async () => {
                    const blob = new Blob(chunks, { type: type === 'video' ? 'video/webm' : 'audio/webm' });
                    const f = new File([blob], `live_${Date.now()}.${type === 'video'?'webm':'webm'}`, { type: blob.type });
                    stream.getTracks().forEach(t => t.stop());
                    await cloudTransfer(f, type);
                };

                const icon = document.getElementById('hud-icon');
                icon.setAttribute('data-lucide', type === 'audio' ? 'mic' : 'video');
                lucide.createIcons();
                
                let s = 0;
                const timer = document.getElementById('hud-time');
                if(clock) clearInterval(clock);
                clock = setInterval(() => {
                    s++;
                    const m = Math.floor(s/60).toString().padStart(2,'0');
                    const sc = (s%60).toString().padStart(2,'0');
                    timer.innerText = `${m}:${sc}`;
                }, 1000);
                
                document.getElementById('hud').classList.remove('hidden');
                rec.start();
                diag(`Démarrage capture ${type}...`, "info");
            } catch (e) {
                alert(`Capture refusée: ${e.message}`);
            }
        }

        function stopMedia() {
            if(rec && rec.state !== 'inactive') {
                rec.stop();
                clearInterval(clock);
                document.getElementById('hud').classList.add('hidden');
            }
        }

        // --- SYNC ENGINE (TEMPS RÉEL) ---
        function startRealtimeSync() {
            diag("Connexion au flux Firestore...", "process");
            db_store.collection('notes').orderBy('createdAt', 'desc').onSnapshot(snap => {
                const list = document.getElementById('archive-list');
                document.getElementById('note-count').innerText = snap.size;
                
                if (snap.empty) {
                    list.innerHTML = `<div class="py-24 text-center opacity-10 flex flex-col items-center">
                        <i data-lucide="inbox" size="50" class="mb-4"></i>
                        <p class="text-[10px] font-black uppercase tracking-widest">Silo d'archives vide</p>
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                list.innerHTML = snap.docs.map(doc => {
                    const d = doc.data();
                    let m = '';
                    if (d.fileUrl) {
                        if (d.fileType === 'image') m = `<img src="${d.fileUrl}" loading="lazy">`;
                        else if (d.fileType === 'video') m = `<video controls playsinline src="${d.fileUrl}"></video>`;
                        else if (d.fileType === 'audio') m = `<audio controls src="${d.fileUrl}"></audio>`;
                    }

                    const date = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleString('fr-FR', {
                        day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'
                    }) : '...';

                    return `
                        <div class="glass-card p-6 rounded-[2.5rem] border-white/5 animate-in zoom-in-95 duration-300 relative group overflow-hidden">
                             <div class="flex justify-between items-start z-10 relative">
                                <div class="max-w-[70%]">
                                    <h4 class="font-black italic uppercase text-blue-500 text-xl leading-none truncate">${d.title}</h4>
                                    <p class="text-[8px] font-bold text-slate-600 uppercase mt-2 tracking-widest">${date}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="burnArchive('${doc.id}', '${d.storagePath||''}')" class="p-3 bg-white/5 text-slate-500 hover:text-red-500 hover:bg-red-500/10 rounded-2xl transition-all">
                                        <i data-lucide="trash-2" size="18"></i>
                                    </button>
                                </div>
                             </div>
                             ${d.content ? `<div class="bg-black/20 p-5 rounded-3xl border border-white/5 mt-4"><p class="text-[13px] text-slate-400 font-medium leading-relaxed">${d.content}</p></div>` : ''}
                             ${m}
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
                diag(`Flux mis à jour (${snap.size} archives)`, "success");
            }, e => diag(`Sync Error: ${e.message}`, "error"));
        }

        async function burnArchive(id, path) {
            if(!confirm("SUPPRIMER L'ARCHIVE DU CLOUD ?")) return;
            try {
                if(path) {
                   const { error } = await sb_store.storage.from(BUCKET).remove([path]);
                   if(error) diag(`Warning Storage Delete: ${error.message}`, "info");
                }
                await db_store.collection('notes').doc(id).delete();
                diag(`Archive ${id} détruite`, "success");
            } catch (e) { alert(`Erreur: ${e.message}`); }
        }
    </script>
</body>
</html>
