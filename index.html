<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doni Mara So</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #ffffff; --text: #1c1c1e; --primary: #007aff; --surface: #f2f2f7; }
        @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --text: #f2f2f7; --surface: #2c2c2e; } }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        .container { padding: 20px; }
        .note-card { background: var(--surface); padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #d1d1d6; }
        .hidden { display: none; }
        .editor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10; padding: 20px; display: flex; flex-direction: column; }
        input, textarea { width: 100%; border: none; outline: none; background: transparent; color: var(--text); }
        input { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        textarea { flex: 1; font-size: 18px; resize: none; }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: white; border: none; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="app-ui" class="container">
        <h1 style="color:var(--primary)">Mara Cloud</h1>
        <div id="list">Chargement des notes...</div>
    </div>
    <button class="fab" onclick="addNote()">+</button>
    <div id="editor-ui" class="editor hidden">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <button onclick="closeEditor()" style="color:var(--primary); background:none; border:none; font-weight:bold;">← Retour</button>
            <span id="status" style="font-size:12px; opacity:0.5;">Prêt</span>
            <button onclick="deleteNote()" style="color:red; background:none; border:none;">Supprimer</button>
        </div>
        <input type="text" id="title" placeholder="Titre..." oninput="autoSave()">
        <textarea id="content" placeholder="Écrivez ici..." oninput="autoSave()"></textarea>
    </div>

    <script>
        const CONF = {
            url: 'https://xiwdnqypjqmtruvfiolu.supabase.co',
            key: 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpd2RucXlwanFtdHJ1dmZpb2x1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NzI5OTksImV4cCI6MjA5NDM0ODk5OX0.ioKD_XvXmZU4V-etRW5pWskEOh1WZy9A_NFY1QOTA8Y'
        };
        const sb = supabase.createClient(CONF.url, CONF.key);
        let activeId = null;
        let timer = null;

        async function load() {
            const { data, error } = await sb.from('notes').select('*').order('created_at', {ascending: false});
            if (error) { document.getElementById('list').innerText = "Erreur de connexion."; return; }
            document.getElementById('list').innerHTML = data?.map(n => `
                <div class="note-card" onclick='openNote(${JSON.stringify(n)})'>
                    <strong>${n.title || 'Sans titre'}</strong>
                    <p style="margin:5px 0 0 0; font-size:14px; opacity:0.7;">${n.content?.substring(0,50) || ''}...</p>
                </div>
            `).join('') || 'Aucune note.';
        }

        async function addNote() {
            const { data, error } = await sb.from('notes').insert([{ title: '', content: '' }]).select();
            if (data) openNote(data[0]);
            else console.error(error);
        }

        function openNote(n) {
            activeId = n.id;
            document.getElementById('title').value = n.title || '';
            document.getElementById('content').value = n.content || '';
            document.getElementById('editor-ui').classList.remove('hidden');
        }

        function closeEditor() {
            document.getElementById('editor-ui').classList.add('hidden');
            load();
        }

        function autoSave() {
            document.getElementById('status').innerText = "Enregistrement...";
            clearTimeout(timer);
            timer = setTimeout(async () => {
                await sb.from('notes').update({ 
                    title: document.getElementById('title').value, 
                    content: document.getElementById('content').value 
                }).eq('id', activeId);
                document.getElementById('status').innerText = "Enregistré";
            }, 1000);
        }

        async function deleteNote() {
            if (confirm("Supprimer cette note ?")) {
                await sb.from('notes').delete().eq('id', activeId);
                closeEditor();
            }
        }
        load();
    </script>
</body>
</html>
