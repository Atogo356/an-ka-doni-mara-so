<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>An ka Doni Mara So</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
body { font-family: Arial; padding: 10px; background:#f2f2f2; }
input, textarea, button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
}
.note {
  background:white;
  padding:10px;
  margin-top:10px;
  border-radius:5px;
}
</style>

</head>

<body>

<h2>📒 An ka Doni Mara So</h2>

<input id="title" placeholder="Titre">
<textarea id="content" placeholder="Écris ta note"></textarea>

<button onclick="saveNote()">💾 Enregistrer</button>

<h3>Notes</h3>
<div id="notes"></div>

<script>

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
  authDomain: "iron-be1a0.firebaseapp.com",
  projectId: "iron-be1a0"
};

// INIT
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SAVE
function saveNote() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  alert("Bouton OK");

  db.collection("notes").add({
    title: title,
    content: content,
    createdAt: new Date()
  })
  .then(() => {
    alert("✅ Sauvegardé !");
  })
  .catch((error) => {
    alert("❌ Erreur: " + error.message);
    console.log(error);
  });
}

// LOAD
db.collection("notes")
.orderBy("createdAt", "desc")
.onSnapshot((snapshot) => {

  const notesDiv = document.getElementById("notes");
  notesDiv.innerHTML = "";

  snapshot.forEach((doc) => {
    const note = doc.data();

    notesDiv.innerHTML += `
      <div class="note">
        <b>${note.title}</b>
        <p>${note.content}</p>
      </div>
    `;
  });

});

</script>

</body>
</html>
