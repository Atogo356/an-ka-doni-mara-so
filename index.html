<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>An ka Doni Mara So</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-4">

<div class="max-w-xl mx-auto space-y-6">

  <h1 class="text-3xl font-black text-center">
    An ka Doni Mara So
  </h1>

  <!-- TEXTE -->
  <div class="bg-slate-900 p-4 rounded-xl space-y-4">

    <input
      id="title"
      class="w-full p-3 rounded bg-slate-800"
      placeholder="Titre"
    />

    <textarea
      id="content"
      class="w-full p-3 rounded bg-slate-800"
      placeholder="Description"
    ></textarea>

    <button
      onclick="saveText()"
      class="bg-blue-600 px-4 py-3 rounded w-full font-bold"
    >
      Sauvegarder texte
    </button>

  </div>

  <!-- FICHIERS -->
  <div class="bg-slate-900 p-4 rounded-xl space-y-4">

    <input
      type="file"
      id="fileInput"
      accept="image/*,audio/*,video/*"
      class="w-full"
    />

    <button
      onclick="uploadFile()"
      class="bg-green-600 px-4 py-3 rounded w-full font-bold"
    >
      Envoyer fichier
    </button>

    <div class="w-full bg-slate-800 rounded h-4 overflow-hidden">
      <div
        id="progress"
        class="bg-green-500 h-full w-0 transition-all duration-300"
      ></div>
    </div>

    <p id="status" class="text-sm text-slate-300"></p>

  </div>

  <!-- NOTES -->
  <div id="notes" class="space-y-4"></div>

</div>

<script>

//////////////////////////////////////////////////////
// FIREBASE
//////////////////////////////////////////////////////

const firebaseConfig = {
  apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
  authDomain: "iron-be1a0.firebaseapp.com",
  projectId: "iron-be1a0",
  storageBucket: "iron-be1a0.appspot.com",
  messagingSenderId: "470790299848",
  appId: "1:470790299848:web:25f13d00162ef126f085fd"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

//////////////////////////////////////////////////////
// SUPABASE
//////////////////////////////////////////////////////

const SUPABASE_URL =
  "https://ajobmetgfnjphlginsxc.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqb2JtZXRnZm5qcGhsZ2luc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMTczMzcsImV4cCI6MjA5Mzg5MzMzN30.wtqJsBUCkW8CnZ1eu3vZMweo1v7nxle3fVpkmcDkgcA";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// IMPORTANT : NOM EXACT DU BUCKET
const BUCKET = "mara-donc";

console.log("Supabase connecté");

//////////////////////////////////////////////////////
// SAUVEGARDE TEXTE
//////////////////////////////////////////////////////

async function saveText() {

  const title =
    document.getElementById('title').value.trim();

  const content =
    document.getElementById('content').value.trim();

  if (!title) {
    alert("Titre requis");
    return;
  }

  try {

    await db.collection('notes').add({
      title: title,
      content: content,
      type: "text",
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('title').value = "";
    document.getElementById('content').value = "";

    alert("Texte sauvegardé");

  } catch(err) {

    console.error(err);
    alert(err.message);

  }

}

//////////////////////////////////////////////////////
// UPLOAD FICHIER
//////////////////////////////////////////////////////

async function uploadFile() {

  const input =
    document.getElementById("fileInput");

  const file = input.files[0];

  if (!file) {
    alert("Choisis un fichier");
    return;
  }

  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progress");

  try {

    status.innerText = "Upload...";
    progress.style.width = "20%";

    const extension =
      file.name.split('.').pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      extension;

    //////////////////////////////////////////////////////
    // UPLOAD SUPABASE
    //////////////////////////////////////////////////////

    const { data, error } =
      await supabaseClient.storage
        .from(BUCKET)
        .upload(fileName, file);

    if (error) {
      console.error(error);
      alert("❌ ERREUR SUPABASE : " + error.message);

      status.innerText = "Erreur upload";
      progress.style.width = "0%";
      return;
    }

    progress.style.width = "70%";

    //////////////////////////////////////////////////////
    // URL PUBLIQUE
    //////////////////////////////////////////////////////

    const { data: publicData } =
      supabaseClient.storage
        .from(BUCKET)
        .getPublicUrl(fileName);

    const publicUrl =
      publicData.publicUrl;

    progress.style.width = "90%";

    //////////////////////////////////////////////////////
    // TYPE
    //////////////////////////////////////////////////////

    let fileType = "file";

    if (file.type.startsWith("image/")) {
      fileType = "image";
    }

    else if (file.type.startsWith("audio/")) {
      fileType = "audio";
    }

    else if (file.type.startsWith("video/")) {
      fileType = "video";
    }

    //////////////////////////////////////////////////////
    // FIRESTORE
    //////////////////////////////////////////////////////

    await db.collection("notes").add({
      title: file.name,
      content: "",
      fileUrl: publicUrl,
      type: fileType,
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    });

    progress.style.width = "100%";

    status.innerText = "Upload réussi";

    input.value = "";

    alert("✅ Fichier sauvegardé");

  }

  catch(err) {

    console.error(err);

    alert(err.message);

    status.innerText = "Erreur critique";

    progress.style.width = "0%";

  }

}

//////////////////////////////////////////////////////
// CHARGEMENT NOTES
//////////////////////////////////////////////////////

function loadNotes() {

  db.collection("notes")
    .orderBy("createdAt", "desc")
    .onSnapshot((snapshot) => {

      const notesDiv =
        document.getElementById("notes");

      notesDiv.innerHTML = "";

      snapshot.forEach((doc) => {

        const data = doc.data();

        const card =
          document.createElement("div");

        card.className =
          "bg-slate-900 p-4 rounded-xl space-y-3";

        let media = "";

        //////////////////////////////////////////////////////
        // IMAGE
        //////////////////////////////////////////////////////

        if (data.type === "image") {

          media = `
            <img
              src="${data.fileUrl}"
              class="rounded-xl w-full"
            >
          `;

        }

        //////////////////////////////////////////////////////
        // AUDIO
        //////////////////////////////////////////////////////

        else if (data.type === "audio") {

          media = `
            <audio controls class="w-full">
              <source src="${data.fileUrl}">
            </audio>
          `;

        }

        //////////////////////////////////////////////////////
        // VIDEO
        //////////////////////////////////////////////////////

        else if (data.type === "video") {

          media = `
            <video controls class="rounded-xl w-full">
              <source src="${data.fileUrl}">
            </video>
          `;

        }

        //////////////////////////////////////////////////////
        // AFFICHAGE
        //////////////////////////////////////////////////////

        card.innerHTML = `
          <h2 class="font-bold text-xl">
            ${data.title || "Sans titre"}
          </h2>

          <p>
            ${data.content || ""}
          </p>

          ${media}
        `;

        notesDiv.appendChild(card);

      });

    });

}

//////////////////////////////////////////////////////
// DEMARRAGE
//////////////////////////////////////////////////////

loadNotes();

</script>

</body>
</html>
