
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>An ka Doni Mara So</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3759/3759902.png" />
    
    <!-- Scripts: Tailwind & Firebase Compat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; -webkit-font-smoothing: antialias; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .tab-active { background: rgba(37, 99, 235, 0.2) !important; border-color: rgba(37, 99, 235, 0.5) !important; color: #60a5fa !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .record-btn { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="font-sans min-h-screen">

    <!-- Login -->
    <div id="login-screen" class="hidden min-h-screen flex flex-col items-center justify-center p-6 bg-[#0f172a] relative overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-80 h-80 bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="w-full max-w-sm text-center relative z-10">
            <div class="mb-8 w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center rotate-6 shadow-2xl">
                <i data-lucide="file-text" size="32"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-2 italic">AN KA DONI MARA SO</h1>
            <p class="text-blue-400 mb-10 text-[10px] font-bold uppercase tracking-[0.3em]">Knowledge Multimedia Safe</p>
            <button onclick="login()" class="w-full py-4 glass border border-white/20 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/controller/google.svg" class="w-6 h-6" alt="G">
                Se connecter avec Google
            </button>
        </div>
    </div>

    <!-- App Main -->
    <div id="app-screen" class="hidden min-h-screen pb-32">
        <header class="sticky top-0 z-30 glass border-b border-white/5 p-4">
            <div class="max-w-2xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div id="user-initial" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold shadow-lg">?</div>
                    <div>
                        <h1 class="text-xs font-bold uppercase tracking-wider text-blue-400">Mon Archive</h1>
                        <p id="user-name" class="text-[10px] text-slate-400">Chargement...</p>
                    </div>
                </div>
                <button onclick="logout()" class="glass p-2 rounded-xl text-slate-400 hover:text-red-400">
                    <i data-lucide="log-out" size="18"></i>
                </button>
            </div>
            <div id="offline-banner" class="hidden bg-red-500/20 text-red-500 text-[10px] font-black uppercase text-center p-2 mt-2">Mode Hors-ligne</div>
        </header>

        <main class="max-w-2xl mx-auto p-4 space-y-6">
            <!-- Search -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="18"></i>
                <input type="text" id="search-input" onkeyup="renderNotes()" placeholder="Rechercher..." class="w-full glass rounded-2xl py-4 pl-12 pr-4 outline-none shadow-xl">
            </div>

            <!-- Notes List -->
            <div id="notes-list" class="grid gap-4"></div>
        </main>

        <!-- Navbar -->
        <div class="fixed bottom-0 inset-x-0 p-6 z-40">
            <div class="max-w-2xl mx-auto flex items-center justify-between glass-card p-4 rounded-[2.5rem]">
                <button onclick="startAudioRecord()" class="w-12 h-12 glass rounded-full flex items-center justify-center text-blue-400"><i data-lucide="mic"></i></button>
                <div onclick="openCompose()" class="record-btn bg-blue-600 relative -top-8 cursor-pointer active:scale-95 transition-all"><i data-lucide="plus" class="text-white"></i></div>
                <label class="w-12 h-12 glass rounded-full flex items-center justify-center text-green-400 cursor-pointer">
                    <i data-lucide="upload"></i>
                    <input type="file" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="compose-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg rounded-[2.5rem] p-8 space-y-5">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-black italic uppercase text-blue-400">Nouvelle Note</h3>
                <button onclick="closeCompose()"><i data-lucide="x" class="text-slate-500"></i></button>
            </div>
            <input type="text" id="note-title" placeholder="Titre..." class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
            <textarea id="note-text" placeholder="Contenu..." rows="5" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none text-xs"></textarea>
            <button id="save-btn" onclick="saveNote()" class="w-full py-5 bg-blue-600 rounded-3xl font-black uppercase tracking-widest shadow-xl">Enregistrer</button>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDgXiAiZXQ9oVDhsXrxgB7mDXVA8yTpYJ4",
            authDomain: "iron-be1a0.firebaseapp.com",
            projectId: "iron-be1a0",
            storageBucket: "iron-be1a0.firebasestorage.app",
            messagingSenderId: "470790299848",
            appId: "1:470790299848:web:25f13d00162ef126f085fd"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allNotes = [];

        // AUTH
        const login = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        const logout = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-initial').innerText = user.displayName[0];
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadNotes();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // FIRESTORE
        const loadNotes = () => {
            db.collection('notes').where('userId', '==', currentUser.uid).orderBy('createdAt', 'desc')
              .onSnapshot(snap => {
                  allNotes = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
                  renderNotes();
              });
        };

        const saveNote = async () => {
            const title = document.getElementById('note-title').value;
            const text = document.getElementById('note-text').value;
            if (!title) return alert("Le titre est obligatoire");

            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";

            try {
                await db.collection('notes').add({
                    title, text, userId: currentUser.uid, groupId: 'general',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Enregistré avec succès !");
                closeCompose();
            } catch (e) {
                alert("Erreur: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Enregistrer";
            }
        };

        const renderNotes = () => {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = allNotes.filter(n => n.title.toLowerCase().includes(q) || n.text.toLowerCase().includes(q));
            const container = document.getElementById('notes-list');
            container.innerHTML = filtered.map(n => `
                <div class="glass-card p-5 rounded-3xl animate-in fade-in">
                    <h3 class="font-bold text-white uppercase text-sm mb-2">${n.title}</h3>
                    <p class="text-slate-400 text-xs">${n.text}</p>
                    <div class="mt-4 text-[9px] text-slate-500 uppercase font-black uppercase tracking-widest">
                        ${n.createdAt ? new Date(n.createdAt.seconds * 1000).toLocaleString() : 'Sync...'}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const openCompose = () => document.getElementById('compose-modal').classList.remove('hidden');
        const closeCompose = () => {
            document.getElementById('compose-modal').classList.add('hidden');
            document.getElementById('note-title').value = '';
            document.getElementById('note-text').value = '';
        };

        lucide.createIcons();
    </script>
</body>
</html>
