<!-- PWA Basic -->
<meta name="theme-color" content="#020617" />
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Scripts: Tailwind, Lucide, Firebase, Supabase -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    body { 
        background-color: #020617; 
        color: #f8fafc; 
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialias;
        overflow-x: hidden;
    }

    .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    
    .fab {
        width: 72px; height: 72px; border-radius: 50%;
        background: #2563eb; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 5px solid #020617;
    }
    .fab:active { transform: scale(0.9) translateY(4px); }

    @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
        70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .recording-active { animation: pulse-red 1.5s infinite; border-color: #dc2626 !important; }

    .media-container video, .media-container img {
        width: 100%; border-radius: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #000;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    audio { width: 100%; height: 40px; border-radius: 10px; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
